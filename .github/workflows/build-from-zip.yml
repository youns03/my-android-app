name: Build Android APK from Web ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL of the project ZIP file'
        required: true
      app_name:
        description: 'Name of the Android App'
        required: true
        default: 'WebToAPK'
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Download Project ZIP
        run: |
          curl -L "${{ github.event.inputs.zip_url }}" -o project.zip
          unzip project.zip -d web_content
          # البحث عن index.html في أي مكان داخل ZIP
          if ! find web_content -name index.html | grep -q 'index.html'; then
            echo "Error: index.html not found in ZIP!"
            exit 1
          fi

      - name: Prepare Android Project Assets
        run: |
          mkdir -p app/src/main/assets/www
          cp -r web_content/* app/src/main/assets/www/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set signing config for release (if any)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          echo "Configuring signing from secrets"
          mkdir -p ~/.android
          echo ${{ secrets.RELEASE_KEYSTORE_BASE64 }} | base64 --decode > ~/release.keystore

      - name: Build with Gradle
        run: |
          BUILD_NAME="${{ github.event.inputs.app_name }}-$(date +%Y%m%d%H%M%S).apk"
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            ./gradlew assembleRelease
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            ./gradlew assembleDebug
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          echo "APK built at $APK_PATH"
          echo "APK_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
